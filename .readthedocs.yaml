# Read the Docs — https://docs.readthedocs.io/en/stable/config-file/v2.html
# Import project at https://readthedocs.org/projects/ (suggested slug: triplemodel)
# and point the GitHub repository to this repo.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - pdf
  - epub
