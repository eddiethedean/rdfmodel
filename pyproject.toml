[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triplemodel"
version = "0.10.1"
description = "Pydantic TripleModel classes ↔ RDF triples via pyoxigraph (beta)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "TripleModel contributors" }]
keywords = ["rdf", "pyoxigraph", "oxigraph", "pydantic", "semantic-web", "linked-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pydantic>=2.5,<3",
    "pyoxigraph>=0.5,<0.6",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "ty>=0.0.1",
    "build>=1.0",
]
docs = [
    "sphinx>=7.4,<9",
    "myst-parser>=3.0,<5",
    "sphinx-rtd-theme>=2.0,<4",
    "sphinx-autodoc-typehints>=3.0,<4",
    "linkify-it-py>=2.0,<3",
]
shacl = [
    "pyshacl>=0.25",
    "rdflib>=7.0,<8",
]

[project.scripts]
triplemodel-codegen = "triplemodel.codegen.cli:main"

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[project.urls]
Homepage = "https://github.com/eddiethedean/triplemodel"
Documentation = "https://triplemodel.readthedocs.io/"
Repository = "https://github.com/eddiethedean/triplemodel"
Changelog = "https://github.com/eddiethedean/triplemodel/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/triplemodel"]

[tool.hatch.build.targets.sdist]
include = [
    "src/triplemodel",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "RELEASING.md",
    "Makefile",
    "examples/readme_examples.py",
    "examples/foaf_person_02.py",
    "examples/exit_criteria_03.py",
    "examples/exit_criteria_04.py",
    "examples/exit_criteria_05.py",
    "examples/exit_criteria_06.py",
    "examples/exit_criteria_07.py",
    "examples/exit_criteria_08.py",
    "examples/exit_criteria_09.py",
    "examples/stores",
    "examples/codegen",
    "examples/realworld",
    "examples/doc",
    "docs/README.md",
    "docs/PLAN.md",
    "docs/ROADMAP.md",
    "docs/ECOSYSTEM.md",
    "docs/ECOSYSTEM_SPARQLMODEL.md",
    "docs/guides",
    "docs/cookbook",
    "docs/API_STABILITY.md",
    "docs/COMPATIBILITY.md",
    "docs/conf.py",
    "docs/api",
    "docs/requirements.txt",
    ".readthedocs.yaml",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--cov=triplemodel", "--cov-report=term-missing", "--cov-fail-under=100"]
[tool.coverage.run]
source = ["triplemodel"]

[tool.coverage.report]
fail_under = 100
show_missing = true
