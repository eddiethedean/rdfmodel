[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rdfmodel"
version = "0.1.0"
description = "Pydantic models ↔ RDF graphs via rdflib (alpha). SparqlModel ORM integration planned from 0.2."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "RDFModel contributors" }]
keywords = ["rdf", "rdflib", "pydantic", "semantic-web", "linked-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pydantic>=2.5,<3",
    "rdflib>=7.0,<8",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "ty>=0.0.1",
]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[project.urls]
Homepage = "https://github.com/RDFModel/RDFModel"
Documentation = "https://github.com/RDFModel/RDFModel#readme"
Repository = "https://github.com/RDFModel/RDFModel"
Changelog = "https://github.com/RDFModel/RDFModel/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/rdfmodel"]

[tool.hatch.build.targets.sdist]
include = [
    "src/rdfmodel",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "docs/PLAN.md",
    "docs/ROADMAP.md",
    "docs/ECOSYSTEM.md",
    "docs/ECOSYSTEM_SPARQLMODEL.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--cov=rdfmodel", "--cov-report=term-missing", "--cov-fail-under=100"]

[tool.coverage.run]
source = ["rdfmodel"]

[tool.coverage.report]
fail_under = 100
show_missing = true
