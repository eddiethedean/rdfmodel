name: CI

on:
  push:
    # Tag pushes are validated by the Release workflow (workflow_call), not here.
    branches:
      - "**"
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,shacl]" build
      - run: python -m build
      - run: pytest
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: ty check src tests

  stores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_stores.py tests/test_streaming.py tests/test_stores_extra.py -q --no-cov

  compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # pydantic 2.5 has no Python 3.13 wheels; min pins run on 3.10 only.
          - python-version: "3.10"
            min-pydantic: true
          - python-version: "3.13"
            min-pydantic: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (min pydantic + pyoxigraph)
        if: matrix.min-pydantic
        run: pip install "pydantic==2.5.0" "pyoxigraph==0.5.0" -e ".[dev,shacl]" build
      - name: Install (min pyoxigraph only)
        if: "!matrix.min-pydantic"
        run: pip install "pyoxigraph==0.5.0" -e ".[dev,shacl]" build
      - run: python -m build
      - run: pytest
