name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Verify before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,shacl,docs]" build twine
      - run: pytest
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: ty check src tests
      - run: sphinx-build -b html docs docs/_build/html -W
      - run: PYTHONPATH=src python examples/exit_criteria_05.py
      - run: PYTHONPATH=src python examples/exit_criteria_06.py
      - run: PYTHONPATH=src python examples/readme_examples.py
      - run: rm -rf dist && python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
